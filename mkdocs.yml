site_name: sweepeval
site_description: Zero-config, black-box sweep and benchmark engine for LLM and agent systems.
site_url: https://abhikatoldtrafford.github.io/sweepeval/
repo_url: https://github.com/abhikatoldtrafford/sweepeval
repo_name: abhikatoldtrafford/sweepeval
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: { icon: material/weather-night, name: Dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: { icon: material/weather-sunny, name: Light mode }

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc: { permalink: true }
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed: { alternate_style: true }

nav:
  - Home: index.md
  - Quickstart: quickstart.md
  - OpenAI scorecard: scorecard.md
  - Retrieval, tools, degradation: scorecard-families.md
  - Concepts:
      - Why no composite score: concepts/no-composite-score.md
      - Comparability: concepts/comparability.md
      - Domination and paired tests: concepts/domination.md
      - SKIPPED semantics: concepts/skipped.md
      - The judge: concepts/judge.md
      - Profiles and cost: concepts/profiles.md
  - Guides:
      - Zero-config walkthrough: guides/zero-config.md
      - Declared sweeps: guides/declared-sweeps.md
      - Gating in CI: guides/ci-gate.md
      - Plugin cookbook: guides/plugins.md
      - Safety and authorization: guides/safety.md
  - Reference:
      - Artifacts: reference/artifacts.md
      - Design specification: superpowers/specs/2026-09-12-sweepeval-design.md
      - Implementation plan: superpowers/plans/2026-09-12-sweepeval-v0.1-plan.md
