name: docs

# Builds the site on every PR (so a broken link or a missing page fails there)
# and publishes it from main.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[docs]"
      - name: build strictly
        # --strict turns a broken internal link into a failure. A docs site
        # that 404s on its own nav is worse than no docs site.
        run: mkdocs build --strict
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && vars.PUBLISH_DOCS == 'true'
        with:
          path: site

  deploy:
    needs: build
    # Opt-in: publishing needs GitHub Pages enabled on the repository, and a
    # deploy job that fails for want of a setting turns the docs check red on
    # every push while the thing it actually checks -- that the site builds --
    # was fine. Set the PUBLISH_DOCS repository variable to "true" to publish.
    if: github.ref == 'refs/heads/main' && vars.PUBLISH_DOCS == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
