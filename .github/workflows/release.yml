name: release

# Tag-driven. A tagged commit publishes the wheel to PyPI via trusted
# publishing (no long-lived token in the repo) and the image to ghcr.
#
# The suite runs again here rather than trusting the CI run on the same commit:
# a release is the one build where "it passed on main" is not good enough,
# because what ships is built from this checkout, not from that one.

# A manual run is inherently a dry run: `verify` and `build` are unconditional,
# and both publish jobs are gated on a `v*` tag. There is deliberately no
# `dry_run` input -- a knob nothing reads is worse than no knob, because
# setting it to false would look like consent to publish and would not be.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev,plots]"
      - run: ruff check src tests
      - run: mypy src/sweepeval/schema src/sweepeval/stats
      - run: lint-imports
      - run: pytest -q
      - name: the demo must run from a clean install
        run: sweepeval demo -n 2

  build:
    needs: verify
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: the tag must match the version in pyproject.toml
        # PyPI accepts a version exactly once, ever. Tagging v0.1.0 while
        # pyproject still says 0.1.0.dev0 would publish the dev artifact under
        # a release tag, and there is no way to take that back -- only to
        # burn the version number and try again.
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          python - <<'PY'
          import os, sys, tomllib, pathlib
          version = tomllib.loads(
              pathlib.Path("pyproject.toml").read_text(encoding="utf-8")
          )["project"]["version"]
          tag = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          if tag != version:
              sys.exit(
                  f"tag {tag!r} does not match pyproject version {version!r}. "
                  "Bump the version, commit, and re-tag."
              )
          print(f"tag and version agree: {version}")
          PY

      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - id: version
        run: echo "version=$(ls dist/*.whl | sed -E 's/.*-([0-9][^-]*)-py3.*/\1/')" >> "$GITHUB_OUTPUT"
      - name: the wheel must carry its data files
        # The corpus and the demo scenario are YAML inside the package. A
        # wheel missing them installs cleanly and fails on first use, which is
        # the failure mode a build check exists to catch.
        run: |
          python -m zipfile -l dist/*.whl > contents.txt
          grep -q "sweepeval/corpus/suites/generic/v1/security.yaml" contents.txt
          grep -q "sweepeval/mock/scenarios/demo.yaml" contents.txt
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  ghcr:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
