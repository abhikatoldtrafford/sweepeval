name: release

# Tag-driven. A tagged commit publishes the wheel to PyPI via trusted
# publishing (no long-lived token in the repo) and the image to ghcr.
#
# The suite runs again here rather than trusting the CI run on the same commit:
# a release is the one build where "it passed on main" is not good enough,
# because what ships is built from this checkout, not from that one.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and check, but publish nothing"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev,plots]"
      - run: ruff check src tests
      - run: mypy src/sweepeval/schema src/sweepeval/stats
      - run: lint-imports
      - run: pytest -q
      - name: the demo must run from a clean install
        run: sweepeval demo -n 2

  build:
    needs: verify
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - id: version
        run: echo "version=$(ls dist/*.whl | sed -E 's/.*-([0-9][^-]*)-py3.*/\1/')" >> "$GITHUB_OUTPUT"
      - name: the wheel must carry its data files
        # The corpus and the demo scenario are YAML inside the package. A
        # wheel missing them installs cleanly and fails on first use, which is
        # the failure mode a build check exists to catch.
        run: |
          python -m zipfile -l dist/*.whl > contents.txt
          grep -q "sweepeval/corpus/suites/generic/v1/security.yaml" contents.txt
          grep -q "sweepeval/mock/scenarios/demo.yaml" contents.txt
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  ghcr:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
