name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -e ".[dev,plots]"
      - name: ruff
        run: ruff check src tests
      - name: mypy (schema, stats)
        # Unpinned python_version, so each matrix job checks its own semantics.
        # 3.10 and 3.12 disagree about numpy's stubs, and only running both
        # catches it -- a 3.12-only check passed a bare np.ndarray that 3.10
        # rejects.
        run: mypy src/sweepeval/schema src/sweepeval/stats
      - name: layering contract
        run: lint-imports
      - name: pytest
        run: pytest -q
      - name: the demo must run without a network
        # The one end-to-end check a user performs first. It exercises
        # discovery, capability detection, the sweep, the statistics and the
        # frontier against the packaged mock, so a break in any of them fails
        # here rather than in someone's terminal.
        run: sweepeval demo -n 2
