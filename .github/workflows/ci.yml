name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -e ".[dev,plots]"
      - name: ruff
        run: ruff check src tests
      - name: mypy (schema, stats)
        run: mypy src/sweepeval/schema src/sweepeval/stats
      - name: layering contract
        run: lint-imports
      - name: pytest
        run: pytest -q
