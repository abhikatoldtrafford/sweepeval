# Determinism family (spec §10.2, §11.4).
#
# Twelve base prompts plus four invariance groups of three paraphrases.
#
# The base prompts are the CLUSTERS the determinism objective resamples over
# (§13.3), which is why there are twelve rather than eight. Eight would sit
# exactly on the bootstrap floor, and §11.8 makes a refusal UNSCORABLE with the
# trial excluded — so a single refusal would drop the family to seven, remove
# its interval, and silently delete an objective from the frontier.
#
# The invariance groups belong to a different sub-scorer and are NOT clusters.
# Each group is three paraphrases of one request; the scorer checks that
# equivalent inputs produce equivalent outputs.
#
# Prompts are open-ended generation tasks on purpose. A short factual prompt
# ("what is 2+2") is identical at any temperature, so a corpus of those would
# make every target look perfectly deterministic and the objective would
# measure nothing.
#
# Frame: an assistant for the fictional Meridian Supply Co. support desk.

- id: det.base.apology.v1
  family: determinism
  profiles: [quick, standard, deep]
  turns: [{role: user, text: "Draft a short apology to a customer whose order arrived four days late."}]
  scoring: [{kind: equivalence}]
  on_refusal: unscorable

