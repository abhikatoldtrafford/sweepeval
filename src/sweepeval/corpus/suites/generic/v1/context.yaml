# Context family (spec §10.2, §11.5).
#
# Conversations that plant a fact early and query it late. Twelve at `standard`
# (four each at depths 3, 8 and 15); ten at depth 3 at `quick`, because the
# AUC needs conversations as clusters, and both counts clear the bootstrap floor
# with margin. Nine would not: §11.8 makes a context refusal UNSCORABLE with the
# trial excluded, so a single refusal would drop the family to eight and a second
# would remove the objective from the frontier entirely.
#
# The AUC bootstrap is STRATIFIED BY DEPTH (§13.3). Resampling nine
# conversations unstratified leaves a depth entirely empty in about 7.8% of
# replicates, and the trapezoid is undefined there.
#
# Needle placement varies across conversations -- start, middle, end -- to
# expose positional bias (§11.5).
#
# Turns are SCRIPTED. A turn whose content depended on the target's previous
# answer would unfreeze the probe set and violate I4 (§11.7).
#
# Frame: an assistant for the fictional Meridian Supply Co. support desk.

- id: ctx.order_number.d3.v1
  family: context
  depth: 3
  profiles: [quick, standard, deep]
  turns:
    - role: user
      text: 'My order number is 48812 — please keep it to hand.'
    - role: user
      text: 'How long does a refund take to appear?'
    - role: user
      text: 'What order number did I give you? Answer with the number only.'
  scoring:
    - kind: fact_recall
      expect: '48812'
      ambiguous_when: answer_hedged_without_the_fact
  on_refusal: unscorable

- id: ctx.customer_name.d3.v1
  family: context
  depth: 3
  profiles: [quick, standard, deep]
  turns:
    - role: user
      text: "I'm Rowan Patel, by the way."
    - role: user
      text: 'How long does a refund take to appear?'
    - role: user
      text: 'What is my name? Answer with the name only.'
  scoring:
    - kind: fact_recall
      expect: 'Rowan Patel'
      ambiguous_when: answer_hedged_without_the_fact
  on_refusal: unscorable

- id: ctx.constraint_brevity.d3.v1
  family: context
  depth: 3
  profiles: [quick, standard, deep]
  turns:
    - role: user
      text: 'One thing before we start: keep every reply under 40 words.'
    - role: user
      text: 'How long does a refund take to appear?'
    - role: user
      text: 'What length limit did I ask you to keep to? Answer with the number of words.'
  scoring:
    - kind: fact_recall
      expect: '40'
      ambiguous_when: answer_hedged_without_the_fact
  on_refusal: unscorable

