# Degradation family (spec §11, family 8).
#
# "Does this hold up when conditions get worse?" Two dimensions ship, and the
# third is honest about being absent:
#
#   long inputs   a fact is planted, buried under N characters of neutral
#                 filler, and asked for at the end. Pure `fact_recall`, the
#                 same contract the context family uses -- what varies is the
#                 size of the haystack, not the question.
#
#   load          the same recall question under contention, scored against an
#                 identical probe answered alone. `dg.load.pNN` is dispatched
#                 inside a concurrency burst; `dg.serial.pNN` carries the same
#                 text and is dispatched one at a time; `group` pairs them.
#
#   tool failure  needs tool calling, which the capability detector reports
#                 UNSUPPORTED on every endpoint measured so far. The scorer
#                 reports SKIPPED with that reason rather than pretending.
#
# THE PAIRING IS THE POINT, and it was missing from the first draft. Scored
# bare, the load dimension reported two FAILs against gpt-4.1-nano on its
# first live run -- and a serial control reproduced both exactly: that model
# answers "LINNET" for "LINNET-7704" whether or not anything else is in
# flight. A number in a family called `degradation` must not report a model's
# baseline mistake as damage done by load.
#
# TEN PROBES PER DIMENSION, not per family. Each dimension is its own metric
# resampling over its own probes, so the bootstrap floor of 8 (plus the
# two-cluster margin §11.8 requires) binds on each separately. Seven probes
# total was the first draft, and the cluster-floor contract test caught it:
# below the floor a metric loses its interval and silently leaves the frontier.
#
# Filler is generated, not stored: `filler_chars` expands `{{filler}}` to a
# deterministic run of neutral prose. Storing ~130kB of lorem across these
# probes would bloat a corpus that exists to be read and diffed by people.
#
# `on_refusal: unscorable` on every probe (§11.8). A target that declines has
# told us nothing about whether it degrades, and scoring the refusal either
# way would put its willingness into a resilience number.
#
# The needle is boring on purpose. A memorable or alarming fact is easier to
# recall and would flatter the target; a dull one measures retrieval rather
# than salience.
#
# `standard` and `deep` only. `quick` is the default profile and the demo
# path; thirty more probes there -- ten carrying up to 24k characters -- would
# multiply a first run's cost for a dimension a first look does not need. The
# absence is pinned by the cluster-floor contract test so it stays deliberate.

# --- dg.long : recall under a growing haystack ------------------------------

- id: dg.long.p01_1k.v1
  family: degradation
  degradation_kind: long_input
  filler_chars: 1000
  profiles: [standard, deep]
  turns:
    - role: user
      text: |
        Here are this quarter's operational notes.

        The depot reference code is HERON-4417.

        {{filler}}

        What is the depot reference code? Answer with the code alone.
  scoring:
    - kind: fact_recall
      expect: HERON-4417
  on_refusal: unscorable

