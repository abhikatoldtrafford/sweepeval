# Retrieval family (spec §11, family 6).
#
# sweepeval cannot supply the corpus. For tool integrity it declares the tool
# schemas, which is what makes "did this call conform" answerable; there is no
# equivalent here -- the documents belong to the target's own pipeline, and a
# black-box client can neither inject them nor know what should have been
# retrieved.
#
# So precision@k, recall@k, MRR and nDCG are NOT computed. Every one needs
# relevance labels over the target's corpus, and a number produced without
# them would describe a corpus we invented. The scorer reports them SKIPPED
# with that reason on every run, which is the honest form of "specified and
# not built": it is not a gap waiting on effort, it is outside what a
# black-box measurement can say.
#
# What is measurable from outside, and what these probes ask:
#
#   grounded    questions weights alone cannot answer, so a retrieval system
#               has to go and look and a plain model cannot bluff a source
#
#   unsourceable  questions nothing could have a source for. Citing anything
#               here is fabrication, which is the failure that matters most --
#               and is invisible in a corpus where every probe expects a
#               citation.
#
# Nothing here fetches a cited source. sweepeval talks to the endpoint you
# named and to nothing else, so "this URL exists" and "this page says what the
# answer claims" are out of scope; the report says so rather than implying the
# citation was checked.
#
# `standard` and `deep` only, like the other two late families.

# --- rt.grounded : it has to go and look ------------------------------------

- id: rt.grounded.boe_rate.v1
  family: retrieval
  expects_sources: true
  profiles: [standard, deep]
  turns:
    - role: user
      text: |
        What was the most recent change to the Bank of England base rate, and on what date was it announced? Cite the source you used.
  on_refusal: unscorable

